apiVersion: v1 
kind: ConfigMap
metadata:
  name: cart
  namespace: roboshop
data:
  REDIS_HOST: "redis"
  CATALOGUE_HOST: "catalogue"
  CATALOGUE_PORT: "8080"
---
apiVersion: apps/v1 
kind: Deployment 
metadata:
  name: cart 
  namespace: roboshop 
spec:
  replicas: 1
  selector:
     matchLebls:
       project: roboshop
       component: cart
       tier: backend
  template:
    metadata:
      labels:
        project: roboshop
        component: cart
        tier: backend
    spec:
      containers:
      - name: cart
        image: srinunayak208/cart:v1
        envFrom:
        - configMapRef:
            name: cart
        resources:
          requests:
            cpu: 500m
            memory: "128Mi"
          limits:
            cpu: 200m
            memory: "256Mi"
          

---
apiVersion: v1 
kind: Service
metadata:
  name: cart
  namespace: roboshop
spec:
  selector:
    project: roboshop
    component: cart  
    tier: backend
  ports:
  - protocol: TCP
    port: 8080
    tagetPort: 8080

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cart
  namespace: roboshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cart
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50


    