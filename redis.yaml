apiVersion: v1 
kind: Service 
metadata:
   name: redis-headless
   namespace: roboshop
   labels:
     project: roboshop
     env: dev 
     component: redis
     tier: database
spec:
  clusterIP: None
  selector:
    project: roboshop
    env: dev 
    component: redis
    tier: database
  ports:
  - protocol: TCP 
    port: 6379
    targetPort: 6379



---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis 
  namespace: roboshop 
  labels:
    project: roboshop
    env: dev 
    component: redis
    tier: database 
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      env: dev 
      component: redis
      tier: database
  template:
    metadata:
     labels:
        project: roboshop
        env: dev 
        component: redis
        tier: database
    spec:
     containers:
      -  name: redis
         image: srinunaik208/redis:v5 
        
        
---
apiVersion: v1 
kind: Service 
metadata:
   name: redis
   namespace: roboshop
   labels:
     project: roboshop
     env: dev 
     component: redis
     tier: database
spec:
  selector:
    project: roboshop
    env: dev 
    component: redis
    tier: database
  ports:
  - protocol: TCP 
    port: 6379
    targetPort: 6379

