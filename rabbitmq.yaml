
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq 
  namespace: roboshop 
  labels:
    project: roboshop
    env: dev 
    component: rabbitmq
    tier: database 
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      env: dev 
      component: rabbitmq
      tier: database
  template:
    metadata:
     labels:
      project: roboshop
      env: dev 
      component: rabbitmq
      tier: database
    spec:
     containers:
       - name: rabbitmq
         image: srinunaik208/rabbitmq:v5 
        
        
---
apiVersion: v1 
kind: Service 
metadata:
   name: rabbitmq
   namespace: roboshop
   labels:
     project: roboshop
     env: dev 
     component: rabbitmq
     tier: database
spec:
  selector:
    project: roboshop
    env: dev 
    component: rabbitmq
    tier: database
  ports:
  - protocol: TCP 
    port: 5672
    targetPort: 5672
---
---
apiVersion: v1 
kind: Service 
metadata:
   name: rabbitmq-headless
   namespace: roboshop
   labels:
     project: roboshop
     env: dev 
     component: rabbitmq
     tier: database
spec:
  clusterIP: None
  selector:
    project: roboshop
    env: dev 
    component: rabbitmq
    tier: database
  ports:
  - protocol: TCP 
    port: 5672
    targetPort: 5672
