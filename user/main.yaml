apiVersion: v1 
kind: ConfigMap
metadata:
  name: user 
  namespace: roboshop
  labels:
    project: roboshop
    component: user
    tier: backend
data:
  REDIS_URL: "redis://redis:6379"
  MONGO_URL: "mongodb://mongodb:27017/users"

---
apiVersion: apps/v1 
kind: Deployment 
metadata:
  name: user 
  namespace: roboshop 
spec:
  replicas: 1
  selector:
     matchLabels:
       project: roboshop
       component: user
       tier: backend
  template:
    metadata:
      labels:
        project: roboshop
        component: user
        tier: backend
    spec:
      containers:
      - name: user
        image: srinunaik208/user:v5
        envFrom:
        - configMapRef:
            name: user
        resources:
          request:
            cpu: "100m"
            memory: "128Gi"
          limit:
            cpu: "200m"
            memory: "256Gi"
          

---
apiVersion: v1 
kind: Service
metadata:
  name: user
  namespace: roboshop
spec:
  selector:
    project: roboshop
    component: user  
    tier: backend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user
  namespace: roboshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50


    