apiVersion: v1 
kind: ConfigMap
metadata:
  name: user
  namespace: roboshop
data:
  MONGO: "true"
  REDIS_URL: 'redis://redis:6379'
  MONGO_URL: "mongodb://mongodb:27017/users"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user 
  namespace: roboshop 
  labels:
    project: roboshop
    env: dev 
    component: user
    tier: backend 
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      env: dev 
      component: user
      tier: backend
  template:
    metadata:
      labels:
        project: roboshop
        env: dev 
        component: user
        tier: backend
    spec:
     containers:
      -  name: user
         image: srinunaik208/user:v5 
         envFrom:
         - configMapRef:
             name: user
         resources:
           requests: 
             memory: "300Mi"
             cpu: "300m"
           limits:
             memory: "500Mi"
             cpu: "500m"
---
apiVersion: v1 
kind: Service 
metadata:
   name: user
   namespace: roboshop
   labels:
     project: roboshop
     env: dev 
     component: user
     tier: backend
spec:
  selector:
    project: roboshop
    env: dev 
    component: user
    tier: backend
  ports:
  - protocol: TCP 
    port: 8080
    targetPort: 8080

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user
  namespace: roboshop

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
    

      