apiVersion: v1 
kind: Service
metadata:
  name: mongodb-headless
  namespace: roboshop
  labels:
    project: roboshop
    component: mongodb
    tier: database
spec:
  clusterIP: None
  selector:
    project: roboshop
    component: mongodb
    tier: database
  ports:
  - protocol: TCP 
    port: 27017
    targetPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: roboshop
    component: mongodb
    tier: database
spec:
  selector:
    project: roboshop
    component: mongodb
    tier: database
  ports:
  - protocol: TCP 
    port: 27017
    targetPort: 27017
---
apiVersion: apps/v1 
kins: StatefulSet 
metadata:
  name: mongodb
  namespace: roboshop 
  labels:
    project: roboshop
    component: mongodb
    tier: database
spec:
 serviceName: mongodb-headless
 replicas: 1
 selector:
   matchLabels:
      project: roboshop
      component: mongodb
      tier: database
 template:
   metadata:
     labels:
       project: roboshop
       component: mongodb
       tier: database
   spec:
     containers:
     - name: mongodb
       image: srinunayak208/mongodb:v1 
       volumeMounts:
       - name: mongodb-storage
         mountPath: /data/db

 volumeClaimTemplates:
 - metadata:
     name: mongodb-storage
   spec:
     accessModes:
     - ReadWriteOnce
     StorageClass: roboshop
     resources:
        requests:
          storage: 4Gi


     