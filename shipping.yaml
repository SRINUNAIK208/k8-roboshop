apiVersion: v1 
kind: ConfigMap
metadata:
  name: shipping
  namespace: roboshop
data:
  CART_ENDPOINT=cart:8080
  DB_HOST=mysql

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping 
  namespace: roboshop 
  labels:
    project: roboshop
    env: dev 
    component: shipping
    tier: backend 
spec:
  replicas: 1
  selectors:
    matchLabels:
      project: roboshop
      env: dev 
      component: shipping
      tier: backend
  templates:
    metadata:
      project: roboshop
      env: dev 
      component: shipping
      tier: backend
    spec:
    - containers:
         name: shipping
         image: srinunaik208/shipping:v5 
         envFrom:
         - configMap:
             name: shipping
         resources:
           requests:
             memory: 
             cpu: 
           limits:
             memory:
             cpu:
---
apiVersion: v1 
kind: Service 
metadata:
   name: shipping
   namespace: roboshop
   labels:
     project: roboshop
     env: dev 
     component: shipping
     tier: backend
spec:
  selectors:
    project: roboshop
    env: dev 
    component: shipping
    tier: backend
  ports:
  - protocol: TCP 
    port: 8080
    targetPort: 8080

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shipping
  namespace: roboshop
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shipping
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
    

      