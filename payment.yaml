apiVersion: v1 
kind: ConfigMap
metadata:
  name: payment
  namespace: roboshop
data:
  CART_HOST: "cart"
  CART_PORT: "8080"
  USER_HOST: "user"
  USER_PORT: "8080"
  AMQP_HOST: "rabbitmq"
---
apiVersion: v1 
kind: Secret 
metadata:
  name: payment 
  namespace: roboshop
type: Opaque
data:
  AMQP_USER: "cm9ib3Nob3A="
  AMQP_PASS: "cm9ib3Nob3AxMjM="

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment 
  namespace: roboshop 
  labels:
    project: roboshop
    env: dev 
    component: payment
    tier: backend 
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      env: dev 
      component: payment
      tier: backend
  template:
    metadata:
     labels:
      project: roboshop
      env: dev 
      component: payment
      tier: backend
    spec:
     containers:
       - name: payment
         image: srinunaik208/payment:v5 
         envFrom:
         - configMapRef:
             name: payment
         - secretRef:
             name: payment
         resources:
           requests:
             memory: "300Mi"
             cpu: "300m"
           limits:
             memory: "500Mi"
             cpu: "500m"
---
apiVersion: v1 
kind: Service 
metadata:
   name: payment
   namespace: roboshop
   labels:
     project: roboshop
     env: dev 
     component: payment
     tier: backend
spec:
  selector:
    project: roboshop
    env: dev 
    component: payment
    tier: backend
  ports:
  - protocol: TCP 
    port: 8080
    targetPort: 8080

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment
  namespace: roboshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
    

      