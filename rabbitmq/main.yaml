apiVersion: v1 
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: roboshop
  labels:
    project: roboshop
    component: rabbitmq
    tier: database
spec:
  clusterIp: None
  selector:
    project: roboshop
    component: rabbitmq
    tier: database
  ports:
  - protocol: TCP 
    port: 5672
    targetPort: 5672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: roboshop
  labels:
    project: roboshop
    component: rabbitmq
    tier: database
spec:
  selector:
    project: roboshop
    component: rabbitmq
    tier: database
  ports:
  - protocol: TCP 
    port: 5672
    targetPort: 5672
---
apiVersion: apps/v1 
kins: StatefulSet 
metadata:
  name: rabbitmq
  namespace: roboshop 
  labels:
    project: roboshop
    component: rabbitmq
    tier: database
spec:
 replicas: 1
 selector:
   matchLabels:
      project: roboshop
      component: rabbitmq
      tier: database
 template:
   metadata:
     labels:
       project: roboshop
       component: rabbitmq
       tier: database
   spec:
     containers:
     - name: rabbitmq
       image: srinunayak208/rabbitmq:v1 
       volumeMounts:
       - name: rabbitmq-storage
         mountPath: /data/db

 volumeClaimTemplates:
 - metadata:
     name: rabbitmq-storage
   spec:
     accessModes:
     - ReadWriteOnce
     StorageClass: roboshop
     resources:
        requests:
          storage: 4Gi


     