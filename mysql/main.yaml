apiVersion: v1 
kind: Service
metadata:
  name: mysql-headless
  namespace: roboshop
  labels:
    project: roboshop
    component: mysql
    tier: database
spec:
  clusterIp: None
  selector:
    project: roboshop
    component: mysql
    tier: database
  ports:
  - protocol: TCP 
    port: 3306
    targetPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    component: mysql
    tier: database
spec:
  selector:
    project: roboshop
    component: mysql
    tier: database
  ports:
  - protocol: TCP 
    port: 3306
    targetPort: 3306

---
apiVersion: apps/v1 
kins: StatefulSet 
metadata:
  name: mysql
  namespace: roboshop 
  labels:
    project: roboshop
    component: mysql
    tier: database
spec:
 replicas: 1
 selector:
   matchLabels:
      project: roboshop
      component: mysql
      tier: database
 template:
   metadata:
     labels:
       project: roboshop
       component: mysql
       tier: database
   spec:
     containers:
     - name: mysql
       image: srinunayak208/mysql:v1 
       volumeMounts:
       - name: mysql-storage
         mountPath: /data/db

 volumeClaimTemplates:
 - metadata:
     name: mysql-storage
   spec:
     accessModes:
     - ReadWriteOnce
     StorageClass: roboshop
     resources:
        requests:
          storage: 4Gi


     