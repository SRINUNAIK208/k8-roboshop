apiVersion: v1 
kind: ConfigMap
metadata:
  name: catalogue
  namespace: roboshop
data:
  MONGO: true
  MONGO_URL: "mongodb://mongodb:27017/catalogue"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue 
  namespace: roboshop 
  labels:
    project: roboshop
    env: dev 
    component: catalogue
    tier: backend 
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      env: dev 
      component: catalogue
      tier: backend
  templates:
    metadata:
      labels:
        project: roboshop
        env: dev 
        component: catalogue
        tier: backend
    spec:
      containers:
      -  name: catalogue
         image: srinunaik208/catalogue:v5 
         envFrom:
         - configMap:
             name: catalogue
         resources:
           requests: 
             memory: "500Mi"
             cpu: "500m"
           limits:
             memory: "300Mi"
             cpu: "300m"
---
apiVersion: v1 
kind: Service 
metadata:
   name: catalogue
   namespace: roboshop
   labels:
     project: roboshop
     env: dev 
     component: catalogue
     tier: backend
spec:
  selector:
    project: roboshop
    env: dev 
    component: catalogue
    tier: backend
  ports:
  - protocol: TCP 
    port: 8080
    targetPort: 8080

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalogue
  namespace: catalogue
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalogue
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
    

      