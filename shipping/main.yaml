apiVersion: v1 
kind: ConfigMap 
metadata:
  name: shipping
  namespace: roboshop
  labels:
    project: roboshop
    component: shipping
    tier: backend
data:
  CART_ENDPOINT: "cart:8080"
  DB_HOST: "mysql" 
---
apiVersion: apps/v1 
kind: Deployment 
metadata:
  name: shipping 
  namespace: roboshop 
spec:
  replicas: 1
  selector:
     matchLebls:
       project: roboshop
       component: shipping
       tier: backend
  template:
    metadata:
      labels:
        project: roboshop
        component: shipping
        tier: backend
    spec:
      containers:
      - name: shipping
        image: srinunayak208/shipping:v1
        envFrom:
        - configMapRef:
            name: shipping
        resources:
          request:
            cpu: 500m
            memory:
          limit:
            cpu: 200m
            memory:
          

---
apiVersion: v1 
kind: Service
metadata:
  name: shipping
  namespace: roboshop
spec:
  selector:
    project: roboshop
    component: shipping  
    tier: backend
  ports:
  - protocol: TCP
    port: 8080
    tagetPort: 8080

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shipping
  namespace: roboshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shipping
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50


    