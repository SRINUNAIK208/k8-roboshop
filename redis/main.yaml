apiVersion: v1 
kind: Service
metadata:
  name: redis-headless
  namespace: roboshop
  labels:
    project: roboshop
    component: redis
    tier: database
spec:
  clusterIp: None
  selector:
    project: roboshop
    component: redis
    tier: database
  ports:
  - protocol: TCP 
    port: 6379
    targetPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: roboshop
  labels:
    project: roboshop
    component: redis
    tier: database
spec:
  selector:
    project: roboshop
    component: redis
    tier: database
  ports:
  - protocol: TCP 
    port: 6379
    targetPort: 6379

---

apiVersion: apps/v1 
kins: StatefulSet 
metadata:
  name: redis
  namespace: roboshop 
  labels:
    project: roboshop
    component: redis
    tier: database
spec:
 replicas: 1
 selector:
   matchLabels:
      project: roboshop
      component: redis
      tier: database
 template:
   metadata:
     labels:
       project: roboshop
       component: redis
       tier: database
   spec:
     containers:
     - name: redis
       image: srinunayak208/redis:v1 
       volumeMounts:
       - name: redis-storage
         mountPath: /data/db

 volumeClaimTemplates:
 - metadata:
     name: redis-storage
   spec:
     accessModes:
     - ReadWriteOnce
     StorageClass: roboshop
     resources:
        requests:
          storage: 4Gi


     