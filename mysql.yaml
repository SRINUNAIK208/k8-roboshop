apiVersion: v1 
kind: Secret
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    env: dev 
    component: mysql
    tier: database
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: "Um9ib1Nob3BAMQ=="
    

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql 
  namespace: roboshop 
  labels:
    project: roboshop
    env: dev 
    component: mysql
    tier: database 
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      env: dev 
      component: mysql
      tier: database
  template:
    metadata:
     labels:
        project: roboshop
        env: dev 
        component: mysql
        tier: database
    spec:
     containers:
      -  name: mysql
         image: srinunaik208/mysql:v5 
         envFrom:
         - secretRef:
            name: mysql
         
        
---
apiVersion: v1 
kind: Service 
metadata:
   name: mysql
   namespace: roboshop
   labels:
     project: roboshop
     env: dev 
     component: mysql
     tier: database
spec:
  selector:
    project: roboshop
    env: dev 
    component: mysql
    tier: database
  ports:
  - protocol: TCP 
    port: 3306
    targetPort: 3306
---

apiVersion: v1 
kind: Service 
metadata:
   name: mysql-headless
   namespace: roboshop
   labels:
     project: roboshop
     env: dev 
     component: mysql
     tier: database
spec:
  clusterIP: None
  selector:
    project: roboshop
    env: dev 
    component: mysql
    tier: database
  ports:
  - protocol: TCP 
    port: 3306
    targetPort: 3306