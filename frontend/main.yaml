apiVersion: v1 
kind: ConfigMap
metadata:
  name: frontend
  namespace: roboshop
  labels:
    project: roboshop
    component: frontend
    tier: frontend
data:
  nginx.conf: |
      user nginx;
      worker_processes auto;
      error_log /var/log/nginx/error.log notice;
      pid /run/nginx.pid;

      include /usr/share/nginx/modules/*.conf;

      events {
          worker_connections 1024;
      }

      http {
          log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for"';

          access_log  /var/log/nginx/access.log  main;

          sendfile            on;
          tcp_nopush          on;
          keepalive_timeout   65;
          types_hash_max_size 4096;

          include             /etc/nginx/mime.types;
          default_type        application/octet-stream;

          include /etc/nginx/conf.d/*.conf;

          server {
              listen       80;
              listen       [::]:80;
              server_name  _;
              root         /usr/share/nginx/html;

              include /etc/nginx/default.d/*.conf;

              error_page 404 /404.html;
              location = /404.html {
              }

              error_page 500 502 503 504 /50x.html;
              location = /50x.html {
              }

              location /images/ {
                expires 5s;
                root   /usr/share/nginx/html;
                try_files $uri /images/placeholder.jpg;
              }
              location /api/catalogue/ { proxy_pass http://catalogue:8080/; }
              location /api/user/ { proxy_pass http://user:8080/; }
              location /api/cart/ { proxy_pass http://cart:8080/; }
              location /api/shipping/ { proxy_pass http://shipping:8080/; }
              location /api/payment/ { proxy_pass http://payment:8080/; }

              location /health {
                stub_status on;
                access_log off;
              }

          }
      }

    
---
apiVersion: apps/v1 
kind: Deployment 
metadata:
  name: frontend 
  namespace: roboshop 
spec:
  replicas: 1
  selector:
     matchLabels:
       project: roboshop
       component: frontend
       tier: frontend
  template:
    metadata:
      labels:
        project: roboshop
        component: frontend
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: srinunaik208/frontend:v5
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/nginx.conf 
          subPath: nginx.conf 
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: "128Mi"
          limits:
            cpu: 200m
            memory: "256Mi"
      volumes:
      - name: nginx-conf 
        configMap:
          name: frontend
          items:
          - key: nginx.conf
            path: nginx.conf
          

---
apiVersion: v1 
kind: Service
metadata:
  name: frontend
  namespace: roboshop
spec:
  selector:
    project: roboshop
    component: frontend  
    tier: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: roboshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: roboshop
  annotations:
    alb.ingress.kubernetes.io/listen-ports:  '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:388343452532:certificate/16f0dc33-01eb-4f97-9178-e983721aa67f
    alb.ingress.kubernetes.io/target-type: ip

spec:
  ingressClassName: alb
  rules:
  - host: dev.srinunayak.online
    http: 
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80



    