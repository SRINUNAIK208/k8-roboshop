apiVersion: v1 
kind: Service 
metadata:
   name: mongodb-headless
   namespace: roboshop
   labels:
     project: roboshop
     env: dev 
     component: mongodb
     tier: database
spec:
  clusterIP: None
  selector:
    project: roboshop
    env: dev 
    component: mongodb
    tier: database
  ports:
  - protocol: TCP 
    port: 27017
    targetPort: 27017
---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb 
  namespace: roboshop 
  labels:
    project: mongodb
    env: dev 
    component: mongodb
    tier: database 
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      env: dev 
      component: mongodb
      tier: database
  template:
    metadata:
      project: roboshop
      env: dev 
      component: mongodb
      tier: database
    spec:
    - containers:
         name: mongodb
         image: srinunaik208/mongodb:v5 
        
---
apiVersion: v1 
kind: Service 
metadata:
   name: mongodb
   namespace: roboshop
   labels:
     project: roboshop
     env: dev 
     component: mongodb
     tier: database
spec:
  selector:
    project: roboshop
    env: dev 
    component: mongodb
    tier: database
  ports:
  - protocol: TCP 
    port: 27017
    targetPort: 27017


      