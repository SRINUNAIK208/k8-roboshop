
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb 
  namespace: roboshop 
  labels:
    project: mongodb
    env: dev 
    component: mongodb
    tier: database 
spec:
  replicas: 1
  selectors:
    matchLabels:
      project: roboshop
      env: dev 
      component: mongodb
      tier: database
  templates:
    metadata:
      project: roboshop
      env: dev 
      component: mongodb
      tier: database
    spec:
    - containers:
         name: mongodb
         image: srinunaik208/mongodb:v5 
         resources:
          requests:
            memory: 
            cpu: 
          limits:
            memory:
            cpu:
        
---
apiVersion: v1 
kind: Service 
metadata:
   name: mongodb
   namespace: roboshop
   labels:
     project: roboshop
     env: dev 
     component: mongodb
     tier: database
spec:
  selectors:
    project: roboshop
    env: dev 
    component: mongodb
    tier: database
  ports:
  - protocol: TCP 
    port: 27017
    targetPort: 27017

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mongodb
  namespace: roboshop
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: mongodb
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
    

      