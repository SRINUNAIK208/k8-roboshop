apiVersion: v1 
kind: ConfigMap
metadata:
  name: cart
  namespace: roboshop
data:
  REDIS_HOST: "redis"
  CATALOGUE_HOST: "catalogue"
  CATALOGUE_PORT: "8080"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart 
  namespace: roboshop 
  labels:
    project: roboshop
    env: dev 
    component: cart
    tier: backend 
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      env: dev 
      component: cart
      tier: backend
  template:
    metadata:
      labels:
        project: roboshop
        env: dev 
        component: cart
        tier: backend
    spec:
     containers:
      -  name: cart
         image: srinunaik208/cart:v5 
         envFrom:
         - configMapRef:
             name: cart
         resources:
           requests:
             memory: "300Mi"
             cpu: "300m"
           limits:
             memory: "500Mi"
             cpu: "500m"
---
apiVersion: v1 
kind: Service 
metadata:
   name: cart
   namespace: roboshop
   labels:
     project: roboshop
     env: dev 
     component: cart
     tier: backend
spec:
  selector:
    project: roboshop
    env: dev 
    component: cart
    tier: backend
  ports:
  - protocol: TCP 
    port: 8080
    targetPort: 8080

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cart
  namespace: roboshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cart
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
    

      