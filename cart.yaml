apiVersion: v1 
kind: ConfigMap
metadata:
  name: cart
  namespace: roboshop
data:
  REDIS_HOST: redis
  CATALOGUE_HOST: catalogue
  CATALOGUE_PORT: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart 
  namespace: roboshop 
  labels:
    project: roboshop
    env: dev 
    component: cart
    tier: backend 
spec:
  replicas: 1
  selectors:
    matchLabels:
      project: roboshop
      env: dev 
      component: cart
      tier: backend
  templates:
    metadata:
      project: roboshop
      env: dev 
      component: cart
      tier: backend
    spec:
    - containers:
         name: cart
         image: srinunaik208/cart:v5 
         envFrom:
         - configMap:
             name: cart
         resources:
           requests:
             memory: 
             cpu: 
           limits:
             memory:
             cpu:
---
apiVersion: v1 
kind: Service 
metadata:
   name: cart
   namespace: roboshop
   labels:
     project: roboshop
     env: dev 
     component: cart
     tier: backend
spec:
  selectors:
    project: roboshop
    env: dev 
    component: cart
    tier: backend
  ports:
  - protocol: TCP 
    port: 8080
    targetPort: 8080

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cart
  namespace: roboshop
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalogue
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
    

      